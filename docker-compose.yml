version: '3.8'

services:
  # Jenkins Master en contenedor Linux
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins_master
    restart: always
    ports:
      - "8080:8080"   # Interfaz web de Jenkins
      - "50000:50000" # Puerto para conectar agentes (Windows Agent)
    volumes:
      - jenkins_data:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true

volumes:
  jenkins_data:
    driver: local

